name: CI/CD Pipeline

on:
  # Job 1 (Testing) - trigger pada Pull Request
  pull_request:
    branches: [main]
  
  # Job 2 & 3 - trigger pada push ke main (setelah PR di-merge)
  push:
    branches: [main]

env:
  REGISTRY: docker.registry.manpit.xet
  IMAGE_NAME: kelompok-2/php-calculator
  
jobs:
  # ============================================
  # JOB 1: TESTING (Continuous Integration)
  # Dijalankan setiap ada PR ke main
  # ============================================
  test:
    name: Testing (CI)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: php-parallel-lint/php-parallel-lint

      # Linter - Cek syntax error
      - name: PHP Linter (Syntax Check)
        run: |
          echo "🔍 Running PHP Linter..."
          php -l src/Functions/Math.php
          php -l src/functions.php
          php -l src/index.php
          php -l tests/MathTest.php
          echo "✅ No syntax errors found!"

      # Unit Test - Cek logika aplikasi
      - name: Run Unit Tests
        run: |
          echo "🧪 Running Unit Tests..."
          php tests/MathTest.php
          echo "✅ All tests passed!"

      # Conflict Check - Pastikan tidak ada conflict markers
      - name: Check for Merge Conflicts
        run: |
          echo "🔀 Checking for merge conflict markers..."
          if grep -rn "<<<<<<< \|======= \|>>>>>>> " --include="*.php" .; then
            echo "❌ Merge conflict markers found!"
            exit 1
          fi
          echo "✅ No merge conflicts found!"

  # ============================================
  # JOB 2: BUILD AND PUSH (Continuous Delivery)
  # Dijalankan hanya setelah PR di-merge ke main
  # ============================================
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    # Hanya jalan jika push ke main (bukan PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup QEMU untuk cross-platform build (Intel & ARM)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login ke Docker Registry
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Extract metadata untuk tags
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      # Build dan Push image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image pushed successfully
        run: |
          echo "✅ Docker image pushed successfully!"
          echo "📦 Tags:"
          echo "   - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "   - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

  # ============================================
  # JOB 3: DEPLOY (Continuous Deployment)
  # Deploy ke server production masing-masing anggota
  # ============================================
  deploy:
    name: Deploy to Production
    needs: build-and-push
    # Hanya jalan jika push ke main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    strategy:
      # Jika satu server gagal, lanjutkan deploy ke server lain
      fail-fast: false
      matrix:
        # Ganti dengan label runner masing-masing anggota kelompok
        runner: [anggota1, anggota2, anggota3]
    
    # Menggunakan self-hosted runner
    runs-on: [self-hosted, '${{ matrix.runner }}']
    
    steps:
      - name: Pull latest image
        run: |
          echo "📥 Pulling latest image..."
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Stop and remove old container
        run: |
          echo "🛑 Stopping old container..."
          docker stop php-calculator || true
          docker rm php-calculator || true

      - name: Run new container
        run: |
          echo "🚀 Starting new container..."
          docker run -d \
            --name php-calculator \
            --restart unless-stopped \
            -p 8080:80 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          echo "✅ Container started on port 8080"

      - name: Cleanup old images
        run: |
          echo "🧹 Cleaning up old images..."
          docker image prune -f
          echo "✅ Cleanup complete!"

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          sleep 5
          curl -f http://localhost:8080 || echo "⚠️ Health check warning"
          echo "✅ Deployment complete!"
